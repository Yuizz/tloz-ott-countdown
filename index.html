<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Amanecer del Día Final · Ocarina of Time (Switch 2)</title>
<meta name="description" content="Cuenta atrás al estilo Majora's Mask para el remake de Ocarina of Time en Nintendo Switch 2. 5 de noviembre de 2026.">
<meta name="theme-color" content="#000000">
<!-- Tarjeta para redes -->
<meta property="og:type" content="website">
<meta property="og:title" content="Amanecer del Día Final">
<meta property="og:description" content="-Quedan pocas horas- · The Legend of Zelda: Ocarina of Time llega a Nintendo Switch 2 el 5 de noviembre de 2026.">
<meta property="og:url" content="https://yuizz.github.io/tloz-ott-countdown/">
<meta property="og:image" content="https://yuizz.github.io/tloz-ott-countdown/og.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Amanecer del Día Final">
<meta name="twitter:description" content="Cuenta atrás para Ocarina of Time en Nintendo Switch 2.">
<meta name="twitter:image" content="https://yuizz.github.io/tloz-ott-countdown/og.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fira+Sans+Condensed:wght@600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #f2f2ec;     /* color del texto; pasa a rojo en las últimas horas */
    --glow: rgba(255,255,255,.35);
    --amp: 0px;         /* intensidad del temblor */
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; background: #000; }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    overflow: hidden;
    font-family: "Fira Sans Condensed", "Arial Narrow", Arial, sans-serif;
    font-weight: 700;
    color: var(--ink);
    text-align: center;
    text-shadow: 0 0 2px var(--glow), 0 0 calc(var(--amp) * 6) var(--glow);
    -webkit-font-smoothing: antialiased;
    transition: color 1s linear;
  }

  main { opacity: 0; animation: fade 2.5s ease forwards .4s; }
  @keyframes fade { to { opacity: 1; } }

  /* Temblor: crece al acercarse la hora */
  .shake { animation: shake .12s linear infinite; }
  @keyframes shake {
    0%   { transform: translate(0, 0); }
    25%  { transform: translate(var(--amp), calc(var(--amp) * -.5)); }
    50%  { transform: translate(calc(var(--amp) * -.8), calc(var(--amp) * .6)); }
    75%  { transform: translate(calc(var(--amp) * .5), var(--amp)); }
    100% { transform: translate(0, 0); }
  }

  /* Transición al cambiar de hora */
  .msg { transition: opacity .9s ease; }
  .msg.out { opacity: 0; }

  .dawn   { display: block; font-size: clamp(1.8rem, 6vw, 3.6rem); line-height: 1; }
  .day    { display: block; font-size: clamp(3.2rem, 12vw, 7rem); line-height: 1.05; }
  .remain { font-size: clamp(1.6rem, 5.4vw, 3.2rem); margin-top: .5em; font-weight: 600; }
  .clock  {
    margin-top: .6em;
    font-size: clamp(2rem, 7vw, 4.2rem);
    font-weight: 700;
    line-height: 1;
    font-variant-numeric: tabular-nums;
    letter-spacing: .02em;
  }
  .clock small {
    display: block;
    margin-top: .5em;
    font-size: clamp(.7rem, 1.8vw, 1rem);
    font-weight: 600;
    letter-spacing: .35em;
    opacity: .55;
  }

  /* Pantalla final */
  .final .clock { display: none; }
  .final .day { font-size: clamp(3rem, 11vw, 6.5rem); }
  .final .remain { font-size: clamp(1.1rem, 3.6vw, 2rem); opacity: .8; }
  #flash {
    position: fixed; inset: 0;
    background: #fff;
    opacity: 0;
    pointer-events: none;
    z-index: 5;
  }
  #flash.on { animation: flash 4s ease forwards; }
  @keyframes flash {
    0% { opacity: 0; } 35% { opacity: 1; } 55% { opacity: 1; } 100% { opacity: 0; }
  }

  /* Controles */
  .controls {
    position: fixed;
    right: 1rem; bottom: 1rem;
    display: flex;
    gap: .5rem;
    z-index: 6;
    transition: opacity .6s;
  }
  body.idle .controls { opacity: 0; pointer-events: none; }
  body.idle { cursor: none; }
  .controls button {
    background: none;
    border: 1px solid rgba(242,242,236,.25);
    border-radius: 999px;
    color: #f2f2ec;
    font: 600 .8rem "Fira Sans Condensed", sans-serif;
    letter-spacing: .12em;
    padding: .45rem .9rem;
    opacity: .45;
    cursor: pointer;
    transition: opacity .2s;
  }
  .controls button:hover, .controls button:focus-visible { opacity: 1; }
  .controls button[hidden] { display: none; }
  #pipVideo { position: fixed; width: 1px; height: 1px; opacity: 0; pointer-events: none; }

  /* Marca de agua */
  .mark {
    position: fixed;
    left: 1rem; bottom: 1rem;
    z-index: 6;
    color: #f2f2ec;
    font: 600 .8rem "Fira Sans Condensed", sans-serif;
    letter-spacing: .3em;
    text-decoration: none;
    text-shadow: none;
    opacity: .3;
    transition: opacity .2s;
  }
  .mark:hover, .mark:focus-visible { opacity: .8; }

  @media (max-width: 560px) {
    .controls { left: 1rem; right: 1rem; bottom: 2.6rem; justify-content: center; flex-wrap: wrap; }
    .mark { left: 0; right: 0; text-align: center; bottom: .8rem; }
  }
  @media (prefers-reduced-motion: reduce) {
    .shake { animation: none; }
  }
</style>
</head>
<body>
  <main><div id="main">
    <h1 class="msg" id="title">
      <span class="dawn" id="dawn">Amanecer del</span>
      <span class="day" id="day">Día Final</span>
    </h1>
    <p class="remain msg" id="remain">-Quedan 24 Horas-</p>
    <p class="clock" id="clock"></p>
  </div></main>
  <div id="flash"></div>
  <div class="controls">
    <button id="lang" type="button">EN</button>
    <button id="pip" type="button" hidden>▣ PIP</button>
    <button id="fs" type="button" hidden>⛶</button>
    <button id="sound" type="button" aria-pressed="false">♪</button>
  </div>
  <a class="mark" href="https://github.com/Yuizz" target="_blank" rel="noopener">YUIZZ</a>
  <video id="pipVideo" muted playsinline></video>

<script>
  // ===== Configuración =====
  // Medianoche del 5 de noviembre de 2026 en la hora local de quien visita.
  // Para una hora fija (p. ej. medianoche ET) usa: new Date("2026-11-05T00:00:00-05:00")
  const TARGET = new Date(2026, 10, 5, 0, 0, 0);
  const URGENT_HOURS = 6;          // desde cuándo empieza el rojo y el temblor
  const RED = [224, 40, 30];
  const WHITE = [242, 242, 236];

  // Modo prueba: ?t=segundos simula el tiempo restante (p. ej. ?t=3605, ?t=10)
  // Idioma: ?lang=es|en fuerza un idioma.
  const params = new URLSearchParams(location.search);
  const offset = params.has("t") ? (TARGET - Date.now()) - Number(params.get("t")) * 1000 : 0;
  const now = () => Date.now() + offset;

  const $ = id => document.getElementById(id);
  const pad = n => String(n).padStart(2, "0");
  const root = document.documentElement.style;

  // ===== Idiomas =====
  const I18N = {
    es: {
      part: ["Amanecer del", "Tarde del", "Noche del"],
      days: ["Día Final", "Segundo Día", "Primer Día"],
      remain: h => `-Quedan ${h} ${h === 1 ? "Hora" : "Horas"}-`,
      far: ["La luna caerá en", d => `${d} Días`, "-Ocarina of Time · Switch 2-"],
      final: ["Amanecer de un Nuevo Día", "Hora de jugar OoT", "-Ocarina of Time · Ya en Nintendo Switch 2-"],
      units: "HORAS · MINUTOS · SEGUNDOS",
      title: "Amanecer del Día Final · Ocarina of Time (Switch 2)",
      titleFinal: "¡Hora de jugar OoT! · Ocarina of Time (Switch 2)",
      sound: on => on ? "♪ SONIDO: SÍ" : "♪ SONIDO: NO",
      fs: on => on ? "⛶ SALIR" : "⛶ PANTALLA COMPLETA",
      other: "EN", otherLabel: "Switch to English"
    },
    en: {
      part: ["Dawn of the", "Afternoon of the", "Night of the"],
      days: ["Final Day", "Second Day", "First Day"],
      remain: h => `-${h} ${h === 1 ? "Hour Remains" : "Hours Remain"}-`,
      far: ["The moon will fall in", d => `${d} Days`, "-Ocarina of Time · Switch 2-"],
      final: ["Dawn of a New Day", "Time to play OoT", "-Ocarina of Time · Out now on Nintendo Switch 2-"],
      units: "HOURS · MINUTES · SECONDS",
      title: "Dawn of the Final Day · Ocarina of Time (Switch 2)",
      titleFinal: "Time to play OoT! · Ocarina of Time (Switch 2)",
      sound: on => on ? "♪ SOUND: ON" : "♪ SOUND: OFF",
      fs: on => on ? "⛶ EXIT" : "⛶ FULLSCREEN",
      other: "ES", otherLabel: "Cambiar a español"
    }
  };
  const detectLang = () => {
    const pick = v => (v || "").slice(0, 2).toLowerCase();
    const forced = pick(params.get("lang")) || pick(localStorage.getItem("lang"));
    if (I18N[forced]) return forced;
    const browser = (navigator.languages || [navigator.language]).map(pick).find(l => I18N[l]);
    return browser || "en";
  };
  let lang = detectLang();
  let T = I18N[lang];

  function partOfDay(date) {
    const h = date.getHours();
    if (h >= 5 && h < 12) return T.part[0];
    if (h >= 12 && h < 20) return T.part[1];
    return T.part[2];
  }

  // ===== Sonido =====
  let audio = null, soundOn = false;
  function bell(strength = 1) {
    if (!soundOn || !audio) return;
    const t = audio.currentTime;
    const base = 196; // Sol grave
    [[1, 1], [2.0, .5], [2.76, .35], [5.4, .18], [8.9, .08]].forEach(([mult, vol]) => {
      const o = audio.createOscillator(), g = audio.createGain();
      o.frequency.value = base * mult;
      g.gain.setValueAtTime(0, t);
      g.gain.linearRampToValueAtTime(.22 * vol * strength, t + .01);
      g.gain.exponentialRampToValueAtTime(.0001, t + 4.5 * strength / (mult * .4 + .6));
      o.connect(g).connect(audio.destination);
      o.start(t); o.stop(t + 6);
    });
  }
  function bells(n, gap = 1.6) {
    for (let i = 0; i < n; i++) setTimeout(() => bell(), i * gap * 1000);
  }

  // Tic seco de reloj, programado en el reloj de audio (preciso aunque la pestaña vaya lenta)
  let noiseBuf = null, keepAlive = null, lastTicSec = Infinity;
  function ticAt(t) {
    // Reloj de torre: golpe grave de madera/metal con algo de cuerpo y resonancia
    if (!noiseBuf) {
      noiseBuf = audio.createBuffer(1, Math.round(audio.sampleRate * .12), audio.sampleRate);
      const d = noiseBuf.getChannelData(0);
      for (let i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / d.length, 6);
    }
    // 1) Golpe: ruido filtrado en graves-medios
    const n = audio.createBufferSource(), f = audio.createBiquadFilter(), g = audio.createGain();
    n.buffer = noiseBuf;
    f.type = "bandpass"; f.frequency.value = 700; f.Q.value = 1.4;
    g.gain.value = .9;
    n.connect(f).connect(g).connect(audio.destination);
    n.start(t);

    // 2) Cuerpo: tono grave que cae de tono (el "tunk" del mecanismo)
    const o = audio.createOscillator(), og = audio.createGain();
    o.type = "sine";
    o.frequency.setValueAtTime(140, t);
    o.frequency.exponentialRampToValueAtTime(70, t + .18);
    og.gain.setValueAtTime(0, t);
    og.gain.linearRampToValueAtTime(.45, t + .004);
    og.gain.exponentialRampToValueAtTime(.0001, t + .28);
    o.connect(og).connect(audio.destination);
    o.start(t); o.stop(t + .3);

    // 3) Resonancia metálica corta del engranaje
    const r = audio.createOscillator(), rg = audio.createGain();
    r.type = "triangle"; r.frequency.value = 330;
    rg.gain.setValueAtTime(.06, t);
    rg.gain.exponentialRampToValueAtTime(.0001, t + .15);
    r.connect(rg).connect(audio.destination);
    r.start(t); r.stop(t + .16);
  }
  // Programa los tics de los próximos ~2 s, alineados con el cambio exacto de segundo
  function scheduleTics(diff) {
    if (!soundOn || !audio || audio.state !== "running") return;
    const base = audio.currentTime + .02;
    const frac = (diff % 1000) / 1000;
    const sec = Math.floor(diff / 1000);
    for (let k = 0; k < 3; k++) {
      const n = sec - k;                  // el tic suena cuando quedan exactamente n segundos
      if (n >= 1 && n < lastTicSec) { ticAt(base + frac + k); lastTicSec = n; }
    }
  }
  // Señal inaudible continua: evita que el sistema/auriculares "duerman" la salida entre tics
  function startKeepAlive() {
    if (keepAlive) return;
    const o = audio.createOscillator(), g = audio.createGain();
    o.frequency.value = 40;
    g.gain.value = .0008;
    o.connect(g).connect(audio.destination);
    o.start();
    keepAlive = o;
  }

  $("sound").addEventListener("click", () => {
    soundOn = !soundOn;
    if (soundOn) {
      audio = audio || new (window.AudioContext || window.webkitAudioContext)();
      audio.resume();
      startKeepAlive();
      lastTicSec = Infinity;
      bell(.6);
    }
    applyStaticText();
  });

  // ===== Textos =====
  let currentKey = null;
  function setMessage(key, dawn, day, remain, animate) {
    if (key === currentKey) return;
    const apply = () => {
      $("dawn").textContent = dawn;
      $("day").textContent = day;
      $("remain").textContent = remain;
    };
    const first = currentKey === null;
    currentKey = key;
    if (first || !animate) return apply();
    $("title").classList.add("out");
    $("remain").classList.add("out");
    setTimeout(() => {
      apply();
      $("title").classList.remove("out");
      $("remain").classList.remove("out");
    }, 950);
  }
  function applyStaticText() {
    document.documentElement.lang = lang;
    document.title = finished ? T.titleFinal : T.title;
    $("sound").textContent = T.sound(soundOn);
    $("sound").setAttribute("aria-pressed", soundOn);
    $("fs").textContent = T.fs(!!(document.fullscreenElement || document.webkitFullscreenElement));
    $("lang").textContent = T.other;
    $("lang").setAttribute("aria-label", T.otherLabel);
    $("lang").title = T.otherLabel;
  }
  $("lang").addEventListener("click", () => {
    lang = lang === "es" ? "en" : "es";
    T = I18N[lang];
    localStorage.setItem("lang", lang);
    currentKey = null;
    applyStaticText();
    if (finished) setMessage("final", ...T.final); else tick(false);
  });

  // ===== Efectos de urgencia =====
  function setUrgency(totalH) {
    const u = Math.max(0, Math.min(1, 1 - totalH / URGENT_HOURS));  // 0 → 1
    const e = u * u;                                                 // empieza suave
    const c = WHITE.map((w, i) => Math.round(w + (RED[i] - w) * e));
    root.setProperty("--ink", `rgb(${c.join(",")})`);
    root.setProperty("--glow", `rgba(${c.join(",")},${.35 + .4 * e})`);
    const lastMinute = totalH * 60 < 1 ? 1.5 : 0;
    root.setProperty("--amp", `${(e * 2.5 + lastMinute).toFixed(2)}px`);
    $("main").classList.toggle("shake", u > 0);
  }

  // ===== Pantalla final =====
  let finished = false;
  function showFinal(live) {
    finished = true;
    const done = () => {
      document.body.classList.add("final");
      $("main").classList.remove("shake");
      root.setProperty("--ink", "rgb(242,242,236)");
      root.setProperty("--glow", "rgba(255,255,255,.35)");
      root.setProperty("--amp", "0px");
      currentKey = null;
      setMessage("final", ...T.final);
      applyStaticText();
    };
    if (live) {
      $("flash").classList.add("on");
      bells(3, 1.4);
      setTimeout(done, 1600);   // cambia mientras la pantalla está en blanco
    } else {
      done();
    }
  }

  // ===== Bucle principal =====
  let lastHour = null;
  function tick(live) {
    const diff = TARGET - now();
    if (diff <= 0) { if (!finished) showFinal(live); return false; }

    const totalH = diff / 36e5;
    const hoursLeft = Math.ceil(totalH);

    if (totalH <= 72) {
      const day = T.days[Math.min(2, Math.floor(totalH / 24))];
      const dawn = partOfDay(new Date(now()));
      setMessage(`${lang}|${dawn}|${day}|${hoursLeft}`, dawn, day, T.remain(hoursLeft), live);
    } else {
      const d = Math.floor(diff / 864e5);
      setMessage(`${lang}|d${d}`, T.far[0], T.far[1](d), T.far[2], live);
    }

    // Campanadas al cambiar de hora (más en las últimas horas)
    if (live && lastHour !== null && hoursLeft !== lastHour) bells(hoursLeft <= URGENT_HOURS ? 2 : 1);
    lastHour = hoursLeft;

    setUrgency(totalH);
    scheduleTics(diff);

    const h = Math.floor(diff / 36e5);
    const m = Math.floor(diff / 6e4) % 60;
    const s = Math.floor(diff / 1e3) % 60;
    $("clock").innerHTML = `${pad(h)}:${pad(m)}:${pad(s)}<small>${T.units}</small>`;
    return true;
  }

  // ===== Pantalla completa =====
  const fsBtn = $("fs");
  if (document.fullscreenEnabled || document.webkitFullscreenEnabled) {
    fsBtn.hidden = false;
    fsBtn.addEventListener("click", () => {
      const el = document.documentElement;
      if (document.fullscreenElement || document.webkitFullscreenElement) {
        (document.exitFullscreen || document.webkitExitFullscreen).call(document);
      } else {
        (el.requestFullscreen || el.webkitRequestFullscreen).call(el);
      }
    });
    document.addEventListener("fullscreenchange", applyStaticText);
    document.addEventListener("webkitfullscreenchange", applyStaticText);
  }

  // ===== Picture-in-Picture: se dibuja el contador en un canvas y se emite como vídeo =====
  const pipBtn = $("pip"), video = $("pipVideo");
  const pc = document.createElement("canvas");
  pc.width = 640; pc.height = 360;
  const px = pc.getContext("2d");
  function drawPip() {
    const cs = getComputedStyle(document.body);
    const family = '"Fira Sans Condensed", "Arial Narrow", Arial, sans-serif';
    const amp = parseFloat(cs.getPropertyValue("--amp")) || 0;
    const jx = (Math.random() - .5) * amp * 2, jy = (Math.random() - .5) * amp * 2;
    px.fillStyle = "#000"; px.fillRect(0, 0, 640, 360);
    px.fillStyle = cs.color; px.textAlign = "center"; px.textBaseline = "middle";
    px.shadowColor = cs.getPropertyValue("--glow"); px.shadowBlur = 6;
    const final = document.body.classList.contains("final");
    const clock = $("clock").firstChild ? $("clock").firstChild.textContent : "";
    px.font = `700 40px ${family}`;  px.fillText($("dawn").textContent, 320 + jx, (final ? 100 : 70) + jy);
    px.font = `700 ${final ? 72 : 84}px ${family}`;  px.fillText($("day").textContent, 320 + jx, (final ? 175 : 140) + jy);
    px.font = `600 ${final ? 26 : 34}px ${family}`;  px.fillText($("remain").textContent, 320 + jx, (final ? 255 : 215) + jy);
    if (!final) { px.font = `700 56px ${family}`; px.fillText(clock, 320 + jx, 290 + jy); }
    px.shadowBlur = 0; px.fillStyle = "rgba(242,242,236,.3)"; px.textAlign = "left";
    px.font = `600 14px ${family}`; px.fillText("Y U I Z Z", 16, 342);
  }
  const canPip = document.pictureInPictureEnabled && pc.captureStream;
  if (canPip) {
    pipBtn.hidden = false;
    let pipTimer = null;
    pipBtn.addEventListener("click", async () => {
      if (document.pictureInPictureElement) return document.exitPictureInPicture();
      drawPip();
      if (!video.srcObject) video.srcObject = pc.captureStream(10);
      await video.play();
      pipTimer = setInterval(drawPip, 100);
      try { await video.requestPictureInPicture(); }
      catch (e) { clearInterval(pipTimer); }
    });
    video.addEventListener("leavepictureinpicture", () => { clearInterval(pipTimer); video.pause(); });
  }

  // Oculta controles y cursor tras 3 s sin mover el ratón
  let idleTimer;
  const wake = () => {
    document.body.classList.remove("idle");
    clearTimeout(idleTimer);
    idleTimer = setTimeout(() => document.body.classList.add("idle"), 3000);
  };
  ["mousemove", "touchstart", "keydown"].forEach(ev => addEventListener(ev, wake, { passive: true }));
  wake();

  applyStaticText();
  if (tick(false)) {
    const id = setInterval(() => { if (!tick(true)) clearInterval(id); }, 250);
  }
</script>
</body>
</html>
